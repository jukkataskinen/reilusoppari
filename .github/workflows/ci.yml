name: CI

on:
  pull_request:
  push:
    branches: [main]

# Kehitysarvoja, EI tuotantosalaisuuksia. Riittävän oikean muotoisia, jotta
# Auth0-clientin ja Supabase-clientin alustustarkistukset eivät kaada buildia.
# Oikeat arvot ovat Vercelissä eivätkä kulje CI:n läpi.
env:
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
  APP_BASE_URL: http://127.0.0.1:3100
  AUTH0_DOMAIN: ci-testi.eu.auth0.com
  AUTH0_CLIENT_ID: ci-client-id-ei-oikea
  AUTH0_CLIENT_SECRET: ci-client-secret-ei-oikea
  AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  INVITE_TOKEN_SECRET: ci-invite-secret-ei-oikea
  SHARE_TOKEN_SECRET: ci-share-secret-ei-oikea
  # ESINETTI_API_KEY jätetään tarkoituksella pois: ilman sitä käytössä on
  # mock, ja juuri sitä CI:n kuuluukin ajaa (ks. src/lib/esinetti/index.ts).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Yksikkö- ja integraatiotestit
        # Supabase-salaisuudet ovat valinnaisia: ilman niitä RLS- ja
        # IDOR-integraatiotestit ohittuvat siististi (hasSupabaseCredentials).
        # Lisää nämä repon Settings → Secrets and variables → Actions -alle
        # ERILLISESTÄ testiprojektista, jotta ne oikeasti ajetaan.
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test

  # Henkilötunnus on sopimuksessa (Jukan päätös 2026-09-11, DECISIONS.md).
  # Vahti ei siis enää kiellä sen olemassaoloa vaan sen vuotamisen: lokiin,
  # listanäkymään tai selaimeen. Ks. scripts/tarkista-tunnisteet.mjs.
  tunnisteet-eivat-vuoda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run tarkista:tunnisteet

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Varmista etta PDF:n fontit ovat funktiopaketissa
        # Next.js ei nae dynaamisesti ladattuja tiedostoja: omat fontit
        # luetaan ajon aikana muodostetulta polulta, ja pdfkit lataa omat
        # vakiofonttinsa dynaamisella requirella. Molemmat toimivat
        # paikallisesti ja kaatuvat vasta tuotannossa, joten tama tarkistus
        # on ainoa paikka, jossa puuttuminen huomataan ajoissa.
        run: |
          TRACE=$(find .next/server -name "route.js.nft.json" -path "*esikatselu*" | head -1)
          if [ -z "$TRACE" ]; then
            echo "VIRHE: esikatselureitin jaljitystiedostoa ei loytynyt."
            exit 1
          fi
          # Hakusanoissa ei ole hakemistoerottimia: jaljitystiedosto
          # kirjoitetaan kaannoskoneen erottimilla, ja ne eroavat Windowsissa
          # ja Linuxissa.
          for needed in "Helvetica.cjs" "plus-jakarta-sans-400.ttf" ".afm"; do
            if ! grep -q "$needed" "$TRACE"; then
              echo "VIRHE: $needed puuttuu funktiopaketista ($TRACE)."
              exit 1
            fi
          done
          echo "OK: PDF:n fontit ovat mukana."

      - name: Varmista ettei salaisuuksia ole selainpaketissa
        # Skripti lukee ne tiedostot, jotka selain oikeasti lataa, ja etsii
        # niista oikean avaimen nakoisia merkkijonoja: Anthropic, Stripe,
        # Resend ja Supabasen service_role.
        #
        # Tama on eri asia kuin lahdekoodin tarkistus (tarkista:tunnisteet):
        # se etsii kaavoja, jotka tiedetaan vaarallisiksi, eika voi nahda
        # sita mita ei osattu odottaa. Tama katsoo lopputulosta.
        run: npm run tarkista:selainpaketti

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Asenna Playwright-selaimet
        run: npx playwright install --with-deps chromium
      # Kutsusivu kysyy kutsun tietokannasta ennen kuin se voi näyttää
      # mitään. Ilman avaimia `getServiceClient()` heittää, ja sivu vastaa
      # 500 sen sijaan että kertoisi kutsun vanhentuneen. E2E ajaa oikeaa
      # sovellusta, joten sillä on oltava samat avaimet kuin yksikkötyöllä.
      - name: Aja e2e
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=high
        # Ei vielä pakollinen, mutta tulos näytetään jokaisessa ajossa.
        continue-on-error: true
